<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spotify Clone</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <button id="menuButton" class="icon-button" title="Menu" aria-label="Open navigation" aria-expanded="false" aria-controls="sidenav">
      <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
    </button>
    <div class="brand">
      <span class="brand-dot"></span>
      <span>Spotify Clone</span>
    </div>
    <form class="searchbar" id="searchForm" autocomplete="off">
      <input id="searchInput" type="search" placeholder="Search YouTube for a song..." spellcheck="false" />
      <button type="submit" id="searchButton" title="Search" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      </button>
    </form>
    <button id="settingsButton" class="icon-button" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <div class="cookie-status" id="cookieStatus">cookies: checking</div>
  </header>

  <div id="edgeZone" aria-hidden="true"></div>
  <nav id="sidenav" class="sidenav" aria-label="Primary" aria-hidden="true">
    <ul>
      <li><button data-nav="home" class="sidenav-item" title="Home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span>Home</span>
      </button></li>
      <li><button data-nav="queue" class="sidenav-item" title="Show queue">
        <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg><span>Queue</span>
      </button></li>
      <li><button data-nav="settings" class="sidenav-item" title="Open settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg><span>Settings</span>
      </button></li>
    </ul>
  </nav>

  <main class="content" id="content">
    <div class="state" id="emptyState">
      <p>Search for anything to start listening.</p>
      <p class="muted">Audio is streamed from YouTube through the local proxy.</p>
    </div>
    <h2 id="homeTitle" class="home-title" hidden></h2>
    <ul class="results" id="results"></ul>
    <div class="more-wrap">
      <button id="moreButton" class="more-button" hidden>Show more</button>
    </div>
  </main>

  <aside class="queue-panel" id="queuePanel" hidden>
    <div class="queue-head">
      <span>Queue (<span id="queueCount">0</span>)</span>
      <div>
        <button id="clearQueue" class="link-button">Clear</button>
        <button id="closeQueue" class="icon-button" title="Hide queue" aria-label="Hide queue">&times;</button>
      </div>
    </div>
    <ul id="queueList"></ul>
  </aside>

  <div class="settings-panel" id="settingsPanel" hidden>
    <div class="settings-head">
      <span>Settings</span>
      <button id="closeSettings" class="icon-button" title="Close settings" aria-label="Close settings">&times;</button>
    </div>
    <div class="setting-row">
      <label for="memoryMode">Memory mode</label>
      <input type="checkbox" id="memoryMode" />
    </div>
    <div class="setting-row">
      <label for="queueDepth">Queue depth</label>
      <input type="number" id="queueDepth" min="0" max="10" step="1" value="3" />
    </div>
    <div class="setting-row setting-folder">
      <label for="libraryDir">Download folder</label>
      <input type="text" id="libraryDir" spellcheck="false" />
      <button id="changeFolder" class="text-button">Change...</button>
    </div>
    <div class="setting-error" id="folderError" hidden></div>
    <div class="setting-row">
      <label>Cookies</label>
      <span id="cookieDetail" class="muted">checking...</span>
    </div>
    <textarea id="cookieText" rows="4" maxlength="1000000" placeholder="Paste Netscape cookies.txt content..."></textarea>
    <div class="setting-row">
      <button id="saveCookies" class="text-button">Save cookies</button>
      <button id="removeCookies" class="text-button">Remove</button>
    </div>
    <div class="setting-error" id="cookieError" hidden></div>
  </div>

  <footer class="player" id="player">
    <div class="now-playing">
      <div class="np-title" id="npTitle">Nothing playing</div>
      <div class="np-channel" id="npChannel">Pick a track with the play button</div>
      <div class="np-download" id="npDownload" hidden>
        <div class="np-dl-bar"><div class="np-dl-fill" id="npDlFill"></div></div>
        <span class="np-dl-text" id="npDlText"></span>
      </div>
    </div>

    <div class="transport">
      <div class="buttons">
        <button id="prevButton" class="icon-button" title="Previous" aria-label="Previous">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14"/><path d="M19 5 9 12l10 7z"/></svg>
        </button>
        <button id="playButton" class="play-button" title="Play" aria-label="Play">
          <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5 19 12 7 19.5z"/></svg>
          <svg id="pauseIcon" class="icon-hidden" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14"/><rect x="13.9" y="5" width="3.6" height="14"/></svg>
        </button>
        <button id="nextButton" class="icon-button" title="Next" aria-label="Next">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14"/><path d="M5 5l10 7L5 19z"/></svg>
        </button>
      </div>
      <div class="scrub">
        <span class="time" id="currentTime">0:00</span>
        <input id="scrubber" class="scrubber" type="range" min="0" max="100" value="0" step="0.1" />
        <span class="time" id="durationTime">0:00</span>
      </div>
    </div>

    <div class="extras">
      <div class="bitrate-group" role="group" aria-label="MP3 quality">
        <button class="bitrate-btn" data-bitrate="128">128</button>
        <button class="bitrate-btn" data-bitrate="192">192</button>
        <button class="bitrate-btn active" data-bitrate="320">320</button>
      </div>
      <button id="queueButton" class="text-button" title="Toggle queue">Queue <span id="queueBadge">0</span></button>
      <input id="volume" class="volume" type="range" min="0" max="1" step="0.01" value="0.9" title="Volume" aria-label="Volume" />
    </div>
  </footer>

  <audio id="audio" preload="none"></audio>
  <script src="/app.js"></script>
</body>
</html>
